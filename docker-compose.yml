services:
  user-service:
    build:
      context: ./.
      target: dev # production or dev
    container_name: user-service
    image: user-service:local
    environment:
    - PORT=3333
    - HOST=${HOST:?}
    - LOG_LEVEL=${LOG_LEVEL:?}
    - APP_KEY=${APP_KEY:?}
    - APP_URL=${APP_URL:?}
    - SESSION_DRIVER=${SESSION_DRIVER:?}
    - DB_HOST=${DB_HOST:?}
    - DB_PORT=${DB_PORT:?}
    - DB_USER=${DB_USER:?}
    - DB_PASSWORD=${DB_PASSWORD:?}
    - DB_DATABASE=${DB_DATABASE:?}
    - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:?}
    # volumes:
      # - ./user-service:/app
      # - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3336:3333"
    networks:
      - user-backend
      - api-network
    restart: always


  postgres:
    image: postgres:18.4-alpine3.23
    container_name: user-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432" #TODO : Expose port only in dev mode, not in production
    networks:
      - user-backend
    volumes:
      - user-db-data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

networks:
  user-backend:
    driver: bridge
    internal: true
  api-network:
    external: true

volumes:
  user-db-data:
